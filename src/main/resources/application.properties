# Server configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=worknest-ems

# PostgreSQL Datasource Configuration
# Render and Supabase/Neon provide DATABASE_URL or discrete parameters
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/worknest_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health endpoint for Render uptime monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Enable CORS allow list if needed
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}
