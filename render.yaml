services:
  - type: web
    name: worknest-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: worknest-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: worknest-postgres
    databaseName: worknest_db
    user: worknest_user
    plan: free
    region: oregon
